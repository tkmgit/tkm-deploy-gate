# Every rule with its default. Copy what you need; omitted rules keep defaults.
# An unknown rule id is a fatal error, so a typo cannot silently disable a rule.

[site]
name = "example.com"
url  = "https://example.com"      # https origin, no trailing slash
root = "."                        # "dist" for a site that builds
trailing_slash = true             # does this site publish /about/ or /about ?
                                  # canonical, sitemap and file layout must agree
exclude = []                      # files that are not pages at all, e.g.
                                  # ["__forms.html"], glob patterns allowed
# route_map = "_redirects"        # for a prerendered build that serves
                                  # dist/_prerendered/es--about.html at /es/about.
                                  # Only 200 rewrites count; a 301 says nothing
                                  # about where a file is served.

# ---------------------------------------------------------------- inventory
[rules."pages.count"]             # default: error, on
min_pages = 1

# ------------------------------------------------------------------- robots
[rules."robots.no_blanket_disallow"]   # default: error, on
path = "robots.txt"

[rules."robots.declares_sitemap"]      # default: error, on
sitemap = "/sitemap.xml"

# -------------------------------------------------------------------- fonts
[rules."fonts.no_third_party"]         # default: error, on
forbidden_hosts = ["fonts.googleapis.com", "fonts.gstatic.com"]
extra_files = ["style.css"]

# --------------------------------------------------------------------- form
[rules."form.required_markup"]         # default: error, OFF
enabled = false
page = "contact/index.html"
required = [
  'data-netlify="true"',
  'netlify-honeypot="company-website"',
  'name="company-website"',
  'name="form-name"',
]
forbidden_text = ["Mockup form"]

# ------------------------------------------------------------------ headers
[rules."headers.required_present"]     # default: error, on
path = "_headers"
required = [
  "X-Content-Type-Options", "Referrer-Policy", "Permissions-Policy",
  "X-Frame-Options", "Strict-Transport-Security", "Content-Security-Policy",
]

# ---------------------------------------------------------------------- CSP
[rules."csp.script_hashes"]            # default: error, on
[rules."csp.style_hashes"]             # default: error, OFF; on where <style> is inline
enabled = false
[rules."csp.external_script_origins"]  # default: error, on
[rules."csp.no_inline_handlers"]       # default: error, on

# Intent verification, for a site that GENERATES its CSP from the build output.
# There, checking the policy against the scripts is a tautology: the generator
# derived one from the other and will happily hash a script nobody wanted.
# Generation asks "does the policy match the output". This asks "does the output
# match intent". Turn csp.script_hashes off and this on, not both.
[rules."scripts.approved_set"]         # default: error, OFF
enabled = false
hashes = []                            # every inline script you intend to ship

# ---------------------------------------------------------------- structure
[rules."structure.single_h1"]          # default: WARN on hand written
severity = "warn"                      # set to error on generated output
[rules."structure.canonical"]          # default: error, on
[rules."structure.meta_description"]   # default: error, on
[rules."structure.description_length"] # default: warn, on
min = 80
max = 200

# ------------------------------------------------------------------- schema
[rules."schema.jsonld_present"]        # default: error, on
[rules."schema.jsonld_parses"]         # default: error, on

# ----------------------------------------------------------------- md layer
[rules."md.alternate_link"]            # default: error, OFF
enabled = false
headers_path = "_headers"
require_headers_entry = false          # Netlify already serves .md as text/markdown.
                                       # true only if this site pins the type itself.
exempt = []                            # pages that deliberately have no rendition

# -------------------------------------------------------------------- links
[rules."links.refs_resolve"]           # default: error, on
extra_files = ["style.css"]

# ------------------------------------------------------------------ sitemap
[rules."sitemap.matches_indexable"]    # default: error, on
path = "sitemap.xml"
[rules."sitemap.no_foreign_hosts"]     # default: error, on

# ---------------------------------------------------------------- redirects
[rules."redirects.targets_exist"]      # default: error, on
path = "_redirects"                    # skipped silently if the file is absent

# ------------------------------------------------------------------- legacy
[rules."legacy.retired_hosts"]         # default: error, OFF
enabled = false
hosts = []                             # every host this site has retired
comment_prefixed_files = ["_redirects", "_headers", "robots.txt", "llms.txt"]
extra_files = ["robots.txt", "sitemap.xml", "llms.txt", "style.css", "_headers", "_redirects"]

# ------------------------------------------------------------------- prices
[rules."prices.quoted_in_price_list"]  # default: error, OFF
enabled = false
price_list = "md/pricing.md"
min_prices = 1
extra_files = ["llms.txt"]

# --------------------------------------------------------------------- a11y
[rules."a11y.img_alt"]                 # default: warn, on
severity = "warn"                      # error on generated output

[rules."a11y.main_landmark"]           # default: error, on
exempt = []                            # path globs, for a template that
                                       # genuinely has no single main region

[rules."a11y.skip_link"]               # default: error, on
text_pattern = "skip"                  # matched against the link text and its
                                       # attributes, case insensitive
exempt = []

# ------------------------------------------------------------------ content
# Values that must not be published outside the pages required to carry them.
# Configure by SHAPE, never by literal value: a report line names the pattern
# that matched, and this engine repository is public.
[rules."content.forbidden_patterns"]   # default: error, OFF
enabled = false
patterns = []                          # e.g. ["[XYZ]\\d{7}[A-Z]"] for a NIE
files = ["llms.txt", "llms-full.txt", "md/**/*.md"]  # scanned on top of every HTML page
allow = []                             # path globs that are REQUIRED to match,
                                       # such as a statutory legal notice. An
                                       # allow entry matching no file is an error.

# ------------------------------------------------------------------- schema
[rules."schema.entity_ids"]            # default: error, OFF
enabled = false
types = ["Organization", "LocalBusiness", "ProfessionalService",
         "Corporation", "Person"]
exempt = []

# A shared node must say the same thing wherever it is repeated. Referring to
# it by @id alone is correct and is not a finding; repeating it with a
# different sameAs set is.
[rules."schema.pinned_nodes"]          # default: error, OFF
enabled = false
# [[rules."schema.pinned_nodes".node]]
# id = "https://example.com/#founder"
# same_as = ["https://www.linkedin.com/in/example/"]

[rules."schema.forbidden_sameas"]      # default: error, OFF
enabled = false
hosts = []                             # sibling brands are not the same entity
